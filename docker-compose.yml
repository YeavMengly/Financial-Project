# version: "3.9"

services:

  # =========================
  # Laravel Application
  # =========================
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: financial_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - db
      - redis
    networks:
      - financial_net

  # =========================
  # NGINX Web Server
  # =========================
  nginx:
    image: nginx:alpine
    container_name: financial_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - financial_net

  # =========================
  # MySQL Database
  # =========================
  db:
    image: mysql:8.0
    container_name: financial_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: financial_project
      MYSQL_ROOT_PASSWORD: 1234567890
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - financial_net

  ngrok:
    image: ngrok/ngrok:latest
    container_name: financial_ngrok
    command:
      - "http"
      - "nginx:80"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - nginx
    networks:
      - financial_net
  # =========================
  # Redis Cache
  # =========================
  redis:
    image: redis:alpine
    container_name: financial_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - financial_net

  # =========================
  # phpMyAdmin (optional UI)
  # =========================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: financial_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: 1234567890
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - financial_net

# =========================
# Networks
# =========================
networks:
  financial_net:
    driver: bridge
  laravel:
    driver: bridge

# =========================
# Volumes
# =========================
volumes:
  db_data:
