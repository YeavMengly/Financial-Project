stages:
  - test
  - build
  - deploy

# =========================
# Global Variables
# =========================
variables:
  APP_NAME: financial_project
  IMAGE_NAME: $CI_REGISTRY_IMAGE/app
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

# =========================
# Cache
# =========================
cache:
  paths:
    - vendor/
    - node_modules/

# =========================
# Laravel Tests
# =========================
test:
  stage: test
  image: php:8.2

  services:
    - mysql:8.0

  variables:
    MYSQL_DATABASE: testing
    MYSQL_ROOT_PASSWORD: root
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: testing
    DB_USERNAME: root
    DB_PASSWORD: root

  before_script:
    - apt-get update && apt-get install -y git unzip curl libzip-dev zip
    - docker-php-ext-install pdo pdo_mysql

    # Install Composer
    - curl -sS https://getcomposer.org/installer | php
    - mv composer.phar /usr/local/bin/composer

    # Laravel setup
    - cp .env.example .env
    - composer install --prefer-dist --no-progress --no-interaction
    - php artisan key:generate

  script:
    - php artisan config:clear
    - php artisan migrate --force
    - php artisan test

# =========================
# Build Docker Image
# =========================
build:
  stage: build
  image: docker:24

  services:
    - docker:24-dind

  variables:
    DOCKER_TLS_CERTDIR: "/certs"

  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" $CI_REGISTRY --password-stdin

  script:
    - docker build -t $IMAGE_NAME:$IMAGE_TAG -f docker/php/Dockerfile .
    - docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest

    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:latest

  only:
    - main
    - master

# =========================
# Deploy to Server
# =========================
deploy:
  stage: deploy
  image: alpine:latest

  before_script:
    - apk add --no-cache openssh bash

    # SSH setup
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa

    # Prevent host verification issue
    - ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts

  script:
    - |
      ssh $SERVER_USER@$SERVER_HOST << EOF

      cd /var/www/financial-project

      echo "Pull latest code..."
      git pull origin main

      echo "Pull latest Docker image..."
      docker pull $IMAGE_NAME:latest

      echo "Rebuild containers..."
      docker compose down
      docker compose up -d --build

      echo "Laravel optimize..."
      docker exec financial_app php artisan migrate --force
      docker exec financial_app php artisan config:cache
      docker exec financial_app php artisan route:cache
      docker exec financial_app php artisan view:cache

      echo "Cleanup..."
      docker image prune -af

      EOF

  only:
    - main
    - master